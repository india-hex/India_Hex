# ============================================================================================
#  India Hex: configuration
#
#  Everything the site shows is controlled from here. After editing, run:
#      python server.py            rebuilds only what changed, then serves http://localhost:8000
#      python server.py --list     prints every variable found in the source data
#      python server.py --publish  rebuilds and pushes the site to GitHub Pages
#
#  Display-only settings (colours, labels, basemaps, toggles, defaults) apply instantly: they go
#  into site/config.json. Data settings (variables, years, resolutions) rebuild only the files
#  they affect.
# ============================================================================================

site:
  title: India Hex
  tagline: Constituencies, districts and H3 hexagons of India
  author: ""                 # shown in the About panel when set
  github: https://github.com/india-hex/India_Hex   # shown in the About panel
  data_credit: GHSL · NASA Black Marble · Esri Land Cover · Hansen GFC · OpenStreetMap · property portals · Election Commission of India (results, Form 20) · CEO Bihar (Form 20) · TCPD Lokdhaba · OpenCity · WorldPop R2025A

# Where the source data lives.
source:
  root: D:/economy_index_data
  processed: processed          # contains h6/ h7/ h8/
  boundaries:
    ac: processed/ac_wgs84.gpkg
    ac_lookup: outputs/ntl/ac_lookup.csv
    pc: processed/pc_wgs84.gpkg
    district: processed/district_lgd_wgs84.gpkg
    # Corrected AC polygons layered over the AC map: each is cut out of the old outlines and added
    # as its own AC (matched to the lookup by state + AC number). Columns: ac_no (+ any others).
    ac_patches:
      - processed/_audit/boundary_fix/new_ac_polygons.gpkg   # 2026-10-20 fix: 27 ACs in Ahmedabad, Surat, Indore

# What the site opens with. Every one of these is also changeable in the UI and kept in the URL.
defaults:
  level: pc                  # state | district | pc | ac
  hex: auto                  # off | auto | 6 | 7 | 8   (auto picks the resolution from the zoom)
  scope: sel                 # sel (selected unit only) | view (everything in view)
  variable: none             # a variable id from `python server.py --list`, or none
  basemap: satellite
  overlays: [ places
  #roads ( roads, places, pois, buildings, esri_labels)
   ]
  scale: relative            # relative | india
  opacity: 0.72
  theme: dark           # light | dark (UI chrome)
  dim_outside_selection: false   # darken everything outside the selected place (off: the map keeps its brightness)

hex:
  resolutions: [6, 7, 8]
  chunk_levels: 4            # cells grouped under an H3 parent this many levels coarser (max 7)
  auto_zoom: {6: 4.6, 7: 6.6, 8: 9.4} # 'auto': res N from this zoom up (below the first: no hexes, unit colours only)
  max_cells_selection: 160000          # larger selections drop one resolution
  auto_max_cells: 90000                # 'auto' with a selection: finest resolution with at most this many cells
  max_cells_view: 260000               # 'everything in view' is skipped above this
  extrude_scale: 8000                  # metres at the top of the scale in 3D mode
  pitch_3d: 52                         # tilt (degrees) when 3D is switched on

# --------------------------------------------------------------------------------------------
# Boundaries and their styling. `palette` picks one of the palettes below.
# --------------------------------------------------------------------------------------------
boundaries:
  palette: muted_earth
  levels:
    state:    {label: States,    one: State,                      short: State, label_minzoom: 3.5}
    district: {label: Districts, one: District,                   short: Dist,  label_minzoom: 6.2}
    pc:       {label: Lok Sabha, one: Parliamentary constituency, short: PC,    label_minzoom: 5.8}
    ac:       {label: Assembly,  one: Assembly constituency,      short: AC,    label_minzoom: 7.6}
  simplify:  {state: 0.004, district: 0.003, pc: 0.003, ac: 0.0008}     # national layers (degrees); the selected place loads its detailed outline
  detail:    {state: 0.0008, district: 0.0003, pc: 0.0003, ac: 0.0001}  # per-unit outline on selection

# Each palette has a `dark` variant (satellite / dark basemaps) and a `light` one.
# Per level: [colour, opacity, width at zoom 8, width at zoom 12, dash ([] = solid)].
palettes:
  muted_earth:
    dark:
      state:    ["#f2e6cc", 0.90, 2.2, 3.4, []]
      pc:       ["#c7bfe0", 0.70, 1.3, 2.2, []]
      district: ["#e0c79a", 0.65, 1.0, 1.8, [3, 2]]
      ac:       ["#a9d3c6", 0.50, 0.6, 1.3, []]
      selection: "#f2c46d"
      hex_line: "rgba(255,255,255,0.30)"
      mask: "rgba(10,12,16,0.50)"
      label: "#f7f3ea"
      label_halo: "rgba(0,0,0,0.75)"
    light:
      state:    ["#5f523f", 0.85, 2.0, 3.2, []]
      pc:       ["#6d6590", 0.70, 1.2, 2.0, []]
      district: ["#97784b", 0.70, 1.0, 1.7, [3, 2]]
      ac:       ["#4d7d74", 0.50, 0.6, 1.2, []]
      selection: "#b7791f"
      hex_line: "rgba(40,38,34,0.28)"
      mask: "rgba(40,36,30,0.22)"
      label: "#2b2924"
      label_halo: "rgba(255,255,255,0.92)"
  ivory:
    dark:
      state:    ["#fbf6ea", 0.92, 2.2, 3.4, []]
      pc:       ["#fbf6ea", 0.62, 1.3, 2.2, []]
      district: ["#fbf6ea", 0.55, 1.0, 1.8, [3, 2]]
      ac:       ["#fbf6ea", 0.32, 0.6, 1.3, []]
      selection: "#f3d48e"
      hex_line: "rgba(255,255,255,0.30)"
      mask: "rgba(10,12,16,0.50)"
      label: "#f7f3ea"
      label_halo: "rgba(0,0,0,0.75)"
    light:
      state:    ["#34322d", 0.85, 2.0, 3.2, []]
      pc:       ["#34322d", 0.55, 1.2, 2.0, []]
      district: ["#34322d", 0.50, 1.0, 1.7, [3, 2]]
      ac:       ["#34322d", 0.30, 0.6, 1.2, []]
      selection: "#c0882b"
      hex_line: "rgba(40,38,34,0.28)"
      mask: "rgba(40,36,30,0.22)"
      label: "#2b2924"
      label_halo: "rgba(255,255,255,0.92)"

# --------------------------------------------------------------------------------------------
# Basemaps (raster tiles, no API keys) and overlays (switchable on top of any basemap).
# `dark: true` uses the dark palette variant for lines and labels.
# --------------------------------------------------------------------------------------------
basemaps:
  # Shown as tabs in this order (show: false keeps a style available in the YAML but off the map).
  # `vector: true` uses the OpenFreeMap style (crisp at every zoom, no key); others are raster tiles.
  - id: map
    label: Map
    vector: true
    dark: false
    attribution: "© OpenFreeMap © OpenMapTiles © OpenStreetMap contributors"
    overlays_off: [roads, places, pois, buildings]   # already part of this style
  - id: satellite
    label: Satellite
    dark: true
    tiles: ["https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}"]
    maxzoom: 19
    attribution: "Imagery © Esri, Maxar, Earthstar Geographics"
  - id: terrain
    label: Terrain
    dark: false
    tiles: ["https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}"]
    maxzoom: 19
    attribution: "Tiles © Esri"
    overlays_off: [roads, places]
  # Extras: set show: true to add them as tabs.
  - id: streets
    label: Streets
    show: false
    dark: false
    tiles: ["https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}"]
    maxzoom: 19
    attribution: "Tiles © Esri, HERE, Garmin, OpenStreetMap contributors"
    overlays_off: [roads, places]
  - id: osm
    label: OSM
    show: false
    dark: false
    tiles: ["https://tile.openstreetmap.org/{z}/{x}/{y}.png"]
    maxzoom: 19
    attribution: "© OpenStreetMap contributors"
    overlays_off: [roads, places, pois]
  - id: light
    label: Light
    show: false
    dark: false
    tiles: ["https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}"]
    maxzoom: 16
    attribution: "Tiles © Esri"
  - id: dark
    label: Dark
    show: false
    dark: true
    tiles: ["https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}"]
    maxzoom: 16
    attribution: "Tiles © Esri"

# Google-style overlays. roads/places/pois/buildings come from OpenFreeMap vector tiles (free,
# no key), using the layers of its "liberty" style grouped by source layer.
overlays:
  vector_style: https://tiles.openfreemap.org/styles/liberty
  groups:
    roads:     {label: Roads,     source_layers: [transportation, transportation_name]}
    places:    {label: Places,    source_layers: [place, water_name, waterway, aerodrome_label]}
    pois:      {label: POIs,      source_layers: [poi]}
    buildings: {label: Buildings, source_layers: [building]}
  raster:
    esri_labels:
      label: Esri labels
      tiles: ["https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}"]
      maxzoom: 19

# --------------------------------------------------------------------------------------------
# Variables. Every numeric column of every parquet file under processed/h{res}/ becomes a
# variable. Columns ending in _YYYY are grouped into one series with a year slider.
# --------------------------------------------------------------------------------------------
variables:
  # Known datasets: paths relative to processed/h{res}/ ({res} = 6, 7 or 8).
  datasets:
    population: {file: "population/h{res}_population_2010_2030_wide.parquet", group: People}
    ntl:        {file: "ntl/h{res}_ntl_2012_2025_wide_with_geography.parquet", group: Economy}
    built:
      file: "built_environment/h{res}_built_environment_2015_2020_2025_wide.parquet"
      group: Built environment
      # cut 2026-10-30 (owner): the residential / non-residential splits, surface and volume
      exclude: ["built_s_*", "built_v_*", built_share_res, built_share_nres, avg_height_res_m, avg_height_nres_m]
    landcover:  {file: "land_cover/h{res}_land_cover_classes_2017_2024_wide.parquet", group: Land cover}
    forest:     {file: "land_cover/h{res}_forest_2012_2025_wide.parquet", group: Forest}
    industrial: {file: "land_cover/h{res}_industrial_wide.parquet", group: Land cover}
    poi:
      file: "commercial_poi/h{res}_poi_hexagon_AGGREGATED.parquet"
      group: Commerce
      fill_missing: 0
      # cut 2026-10-30 (owner): the 16 POI categories; All POIs and Commercial POIs stay
      exclude: [retail, food_drink, finance, offices, lodging, fuel_auto, markets, industry_logistics, crafts,
                leisure_entertainment, health, education, transport, tourism, government_public, worship]
    property:
      file: "property/h{res}_property_hexagon_AGGREGATED.parquet"
      group: Property
      pivot: segment         # long table: one column per segment, named <segment>_<column>
      segments: [residential_buy, residential_rent, commercial_buy, commercial_rent]
      # cut 2026-10-30 (owner): every static series except the residential sale rate
      exclude: [residential_buy_listings_total, residential_buy_price_median_inr, residential_rent_listings_total,
                residential_rent_price_median_inr, commercial_buy_listings_total, commercial_buy_price_median_inr,
                commercial_buy_rate_median_inr_per_sqft, commercial_rent_listings_total, commercial_rent_price_median_inr]
    property_quarterly:
      file: "property/h{res}_property_quarterly_panel_2021_2026.parquet"
      group: Property
      pivot: segment
      segments: [residential_buy, residential_rent]
      period: [date]           # one row per cell, segment and date -> a time series (Jan 2021 ... Mar 2026)
      sparse: true             # eight cities: only the index chunks holding them are stored
      ignore: [year, quarter]  # restate the date; not variables
    # ---- Elections: one or two states each, so files are chunk-sparse (only the index chunks that
    # hold the state's cells). Unit values come from the official ECI results (units_table), not from
    # the hexagons; units outside `states` get none. Series ids carry the dataset prefix.
    karnataka_ae:
      root: D:/booth_catchment/KA/outputs/maps
      file: h{res}_karnataka_ae.parquet
      group: Karnataka Assembly (2018, 2023)
      menu: [Elections, Karnataka, Assembly]
      prefix: ka_ae_
      states: [KARNATAKA]
      sparse: true
      h8: all
      exclude: ["*bjp_inc_margin_pp*", "*lead_margin_pp*", "*is_lead_*"]
      units_table: &ka_table
        path: D:/booth_catchment/KA/outputs/maps/units/karnataka_ae{year}_ac_official.parquet
        state: KARNATAKA
        key: ac_no
        weights: {"votes_{year}": "total_valid_{year}"}     # share denominator (reproduces the AC shares exactly)
        lead: {column: "lead_bucket_{year}", share: "{cat}_share_{year}"}
        na_flag: incomplete_booth_data                  # missing cells in these ACs are drawn grey
      lead: &ka_lead
        from: is_lead_
        label: Leading party
        note: "Leading party is the bucket with the most votes in the cell, not a seat winner"
        categories:
          bjp:     {label: BJP, color: "#E69F00"}
          bjp_jds: {label: BJP+JD(S), color: "#E69F00"}
          inc:     {label: INC, color: "#0072B2"}
          inc_jds: {label: INC+JD(S), color: "#0072B2"}
          jds:     {label: JD(S), color: "#009E73"}
          oth:     {label: Others, color: "#999999"}
      caveat: &ka_caveat "Modelled from booth results spread over where voters live (method: booth catchments on the 100 m population grid). Shares of valid votes incl. NOTA, EVM + postal. Grey: AC booth data incomplete."
      na_label: &ka_na AC booth data incomplete
    karnataka_ge:
      root: D:/booth_catchment/KA/outputs/maps
      file: h{res}_karnataka_ge.parquet
      group: Karnataka Lok Sabha (2014, 2019, 2024)
      menu: [Elections, Karnataka, Lok Sabha]
      prefix: ka_ge_
      states: [KARNATAKA]
      sparse: true
      h8: all
      exclude: ["*bjp_inc_margin_pp*", "*lead_margin_pp*", "*party_lead_margin_pp*", "*is_lead_*"]
      units_table:
        <<: *ka_table
        path: D:/booth_catchment/KA/outputs/maps/units/karnataka_ge{year}_ac_official.parquet
      lead: *ka_lead
      caveat: *ka_caveat
      na_label: *ka_na
    bihar_ae2025:
      root: D:/booth_catchment/BR/outputs/maps
      file: h{res}_bihar_ae2025_model.parquet
      group: Bihar Assembly 2025
      menu: [Elections, Bihar, Assembly]
      prefix: br_ae_
      states: [BIHAR]
      sparse: true
      h8: all
      exclude: ["*is_lead_*"]
      units_table:
        path: D:/booth_catchment/BR/outputs/maps/units/bihar_ae2025_ac_official.parquet
        state: BIHAR
        key: ac_no
        weights: {"votes_{year}": "valid_votes_{year}"}
        lead: {column: "lead_bucket_{year}", share: "{cat}_share_{year}"}
      lead:
        from: is_lead_
        label: Leading alliance
        note: "Leading party is the bucket with the most votes in the cell, not a seat winner"
        categories:
          nda:    {label: NDA, color: "#E69F00"}
          mgb:    {label: Mahagathbandhan, color: "#0072B2"}
          jsp:    {label: Jan Suraaj, color: "#CC79A7"}
          others: {label: Others, color: "#999999"}
      caveat: "Modelled from booth results spread over where voters live (method: booth catchments on the 100 m population grid). Shares of valid votes incl. NOTA, EVM + postal; turnout is EVM votes / electors."
    # ---- Booth counts per election (pins counted in the cell they lie in). Unit values come from the
    # AC tables: an AC without complete booth data has none, and a PC / district / state sums its other
    # ACs and says how many it leaves out.
    karnataka_ae_booths:
      root: D:/booth_catchment/KA/outputs/maps/booths/counts
      file: h{res}_karnataka_ae_booths.parquet
      group: Karnataka Assembly (2018, 2023)
      menu: [Elections, Karnataka, Assembly]
      prefix: ka_ae_
      states: [KARNATAKA]
      sparse: true
      h8: all
      units_table: &ka_ae_bc
        path: D:/booth_catchment/KA/outputs/maps/booths/counts/units/karnataka_ae{year}_booth_counts.parquet
        state: KARNATAKA
        key: ac_no
        fallback: false        # no hexagon sum where the AC's booth data is incomplete
        extra: {located: "booths_located_{year}", unlocated: "booths_unlocated_{year}"}
      caveat: &booth_caveat "Booths with coordinates, counted where their pin lies. ACs with incomplete booth data are blank."
    karnataka_ge_booths:
      root: D:/booth_catchment/KA/outputs/maps/booths/counts
      file: h{res}_karnataka_ge_booths.parquet
      group: Karnataka Lok Sabha (2014, 2019, 2024)
      menu: [Elections, Karnataka, Lok Sabha]
      prefix: ka_ge_
      states: [KARNATAKA]
      sparse: true
      h8: all
      units_table:
        <<: *ka_ae_bc
        path: D:/booth_catchment/KA/outputs/maps/booths/counts/units/karnataka_ge{year}_booth_counts.parquet
      caveat: *booth_caveat
    bihar_ae2025_booths:
      root: D:/booth_catchment/BR/outputs/maps/booths/counts
      file: h{res}_bihar_ae2025_booths.parquet
      group: Bihar Assembly 2025
      menu: [Elections, Bihar, Assembly]
      prefix: br_ae_
      states: [BIHAR]
      sparse: true
      h8: all
      units_table:
        path: D:/booth_catchment/BR/outputs/maps/booths/counts/units/bihar_ae2025_booth_counts.parquet
        state: BIHAR
        key: ac_no
        fallback: false
        extra: {located: "booths_located_{year}", unlocated: "booths_unlocated_{year}"}
      caveat: *booth_caveat

  # Any other parquet under processed/h{res}/**/ is picked up automatically (its folder name
  # becomes the group). These files are skipped: point-level tables, previews, and copies.
  auto_discover: true
  skip_files: ["*MAPPED*", "*preview*", "*land_summary*"]

  # Columns never published (glob patterns on the column / series name).
  exclude:
    - "*pixel*"
    - "*coverage*"
    - "*cloud_nodata*"
    - "*_p25_*"
    - "*_p75_*"
    - "*_p25"
    - "*_p75"
    - "*n_localities*"
    - "*listings_approx_location*"
    - "*listings_used*"
    - "*distinct_locations*"
    - "*listings_with_price*"
    - "*listings_with_rate*"
    - "*area_median_sqft*"
    - "*rent*rate_median*"            # rent listings have no per-sqft rate

  # Series published at H8 as well (H8 costs ~9 MB per series-year; H6/H7 together ~1.4 MB).
  # Everything else is published at H6 + H7; the map falls back to H7 when H8 is chosen.
  # Use [all] to publish everything at H8 (watch the size report against GitHub's 1 GB).
  h8:
    - population
    - ntl_mean
    - built_share_total
    - avg_height_total_m
    - landcover_forest_share
    - landcover_agriculture_share
    - landcover_built_share
    - landcover_water_wetland_share
    - forest_cover_share_canopy10
    - all_poi_total
    - commercial_total
    - residential_buy_rate_median_inr_per_sqft
  h8_years: all                 # all | latest | latest_and_steps (latest + every 5th year)

  # Size guard for GitHub Pages (hard limit 1 GB for a published site).
  budget_mb: 950

  # Shown first in pickers and in every unit's "key figures", in this order.
  featured:
    - population
    - ntl_mean
    - built_share_total
    - landcover_agriculture_share
    - landcover_forest_share
    - all_poi_total
    - residential_buy_rate_median_inr_per_sqft
    - avg_height_total_m

  # Per-variable settings. Anything not given is inferred from the column name:
  #   agg     sum | mean | median | wmean   how hexes combine into a unit (sum for counts/areas,
  #                                  mean for shares/means/heights, median for prices/rates,
  #                                  wmean = mean weighted by the `weight` column, e.g. "votes_{year}")
  #   density true lets the UI show it per km² (default true for sum-type variables)
  #   ramp    ylorrd | magma | viridis | greens | ylgn | blues | purples | cividis | oranges | bugn |
  #           rdpu | greys | rdbu | brbg | puor | buor (diverging: also set diverging: true)
  #   format  int | dec1 | dec2 | pct (value is a 0-1 share) | pp (percentage points) | inr
  #   breaks  fixed class breaks, used in every scale mode;  featured: true lists it first in its group
  # Unknown keys are an error.
  overrides:
    population:          {label: Population, unit: people, ramp: ylorrd, format: int, default_year: 2025, note: "GHSL GHS-POP; model estimates on the 2011 Census; 2025 and 2030 are projections"}
    ntl_mean:            {label: Night lights, unit: nW/cm²/sr, ramp: magma, format: dec2, note: "NASA Black Marble mean radiance of ~500 m pixels"}
    built_share_total:   {label: Built-up share, ramp: ylorrd, format: pct, note: "GHSL built-up surface as a share of the cell"}
    built_share_res:     {label: Built-up share (residential), ramp: ylorrd, format: pct}
    built_share_nres:    {label: Built-up share (non-residential), ramp: ylorrd, format: pct}
    built_s_total_m2:    {label: Built-up surface, unit: m², ramp: ylorrd, format: int}
    built_s_res_m2:      {label: Built-up surface (residential), unit: m², ramp: ylorrd, format: int}
    built_s_nres_m2:     {label: Built-up surface (non-residential), unit: m², ramp: ylorrd, format: int}
    built_v_total_m3:    {label: Built volume, unit: m³, ramp: ylorrd, format: int}
    built_v_res_m3:      {label: Built volume (residential), unit: m³, ramp: ylorrd, format: int}
    built_v_nres_m3:     {label: Built volume (non-residential), unit: m³, ramp: ylorrd, format: int}
    avg_height_total_m:  {label: Average building height, unit: m, ramp: blues, format: dec1}
    avg_height_res_m:    {label: Average height (residential), unit: m, ramp: blues, format: dec1}
    avg_height_nres_m:   {label: Average height (non-residential), unit: m, ramp: blues, format: dec1}
    landcover_forest_share:        {label: Trees (land cover), ramp: greens, format: pct, note: "Esri 10 m land cover"}
    landcover_agriculture_share:   {label: Crops (land cover), ramp: ylgn, format: pct, note: "Esri 10 m land cover"}
    landcover_built_share:         {label: Built area (land cover), ramp: ylorrd, format: pct, note: "Esri 10 m land cover"}
    landcover_open_natural_share:  {label: Open & natural land, ramp: ylgn, format: pct, note: "Esri 10 m land cover: rangeland, bare ground, snow"}
    landcover_water_wetland_share: {label: Water & wetland, ramp: blues, format: pct, note: "Esri 10 m land cover"}
    forest_cover_share_canopy10:   {label: Forest cover (canopy ≥10%), ramp: greens, format: pct, note: "Hansen Global Forest Change"}
    forest_lost_share:             {label: Forest lost (cumulative), ramp: ylorrd, format: pct, note: "Hansen GFC loss since 2001"}
    tree_canopy_avg_pct:           {label: Tree canopy 2000, unit: "%", ramp: greens, format: dec1, agg: mean}
    permanent_water_share:         {label: Permanent water, ramp: blues, format: pct}
    industrial_landuse_share_osm2026: {label: Industrial land use, ramp: purples, format: pct, note: "OpenStreetMap industrial landuse, 2026"}
    is_industrial:       {label: Industrial cell (≥25%), ramp: purples, format: pct, agg: mean}
    all_poi_total:       {label: All POIs, unit: POIs, ramp: purples, format: int, note: "OpenStreetMap points of interest"}
    commercial_total:    {label: Commercial POIs, unit: POIs, ramp: purples, format: int}
    residential_buy_rate_median_inr_per_sqft:  {label: Residential sale rate, unit: ₹/sqft, ramp: viridis, format: inr, agg: median, density: false}
    residential_buy_price_median_inr:          {label: Residential sale price, unit: ₹, ramp: viridis, format: inr, agg: median, density: false}
    residential_rent_price_median_inr:         {label: Residential rent, unit: ₹/month, ramp: viridis, format: inr, agg: median, density: false}
    commercial_buy_rate_median_inr_per_sqft:   {label: Commercial sale rate, unit: ₹/sqft, ramp: viridis, format: inr, agg: median, density: false}
    commercial_buy_price_median_inr:           {label: Commercial sale price, unit: ₹, ramp: viridis, format: inr, agg: median, density: false}
    commercial_rent_price_median_inr:          {label: Commercial rent, unit: ₹/month, ramp: viridis, format: inr, agg: median, density: false}
    residential_buy_locality_price_median:     {label: Locality sale rate (quarterly), unit: ₹/sqft, ramp: viridis, format: inr, agg: median, density: false, note: "Housing.com locality average asking price per sq ft, quarterly 2021–2025 then monthly in 2026; Mumbai, Pune, Bengaluru, Gurugram, Ahmedabad, Hyderabad, Chennai, Kolkata"}
    residential_rent_locality_price_median:    {label: Locality rent (quarterly), unit: ₹/month, ramp: viridis, format: inr, agg: median, density: false, note: "Housing.com locality average monthly rent, quarterly 2021–2025 then monthly in 2026; same eight cities"}
    # ---- Elections (shares: of valid votes incl. NOTA; agg wmean is only the fallback where an AC
    # has no official row: unit values come from the official results)
    ka_ae_bjp_share:      &ka_bjp {label: BJP vote share, format: pct, agg: wmean, weight: "votes_{year}", ramp: oranges, featured: true, note: &ka_note "Unit values are the official ECI results; hexagons are modelled. ACs with incomplete booth data have complete official AC values"}
    ka_ae_inc_share:      &ka_inc {label: INC vote share, format: pct, agg: wmean, weight: "votes_{year}", ramp: blues, featured: true, note: *ka_note}
    ka_ae_jds_share:      &ka_jds {label: JD(S) vote share, format: pct, agg: wmean, weight: "votes_{year}", ramp: bugn, featured: true, note: *ka_note}
    ka_ae_oth_share:      &ka_oth {label: Others vote share (incl. NOTA), format: pct, agg: wmean, weight: "votes_{year}", ramp: greys, note: *ka_note}
    ka_ae_bloc_margin_pp: &ka_margin {label: "Margin, BJP side − INC side", unit: pp, format: pp, agg: wmean, weight: "votes_{year}", density: false, ramp: buor, diverging: true, breaks: [-20, -10, -5, -2, 2, 5, 10, 20], featured: true, note: "Percentage points of valid votes; positive = BJP side ahead (2024: BJP+JD(S)), negative = INC side ahead (2019: INC+JD(S)). Unit values are the official ECI results"}
    ka_ae_turnout_share:  &ka_turnout {label: Turnout (valid votes / electors), format: pct, agg: wmean, weight: "electors_{year}", ramp: viridis, note: *ka_note}
    ka_ae_votes:          &ka_votes {label: Valid votes, unit: votes, format: int, agg: sum, ramp: ylorrd, note: *ka_note}
    ka_ae_electors:       &ka_electors {label: Electors, unit: electors, format: int, agg: sum, ramp: ylorrd, note: "Hexagon electors are modelled; unit values are the official ECI electors"}
    ka_ae_lead:           {featured: true}
    ka_ge_bjp_share:      *ka_bjp
    ka_ge_inc_share:      *ka_inc
    ka_ge_jds_share:      *ka_jds
    ka_ge_oth_share:      *ka_oth
    ka_ge_inc_jds_share:  {label: INC+JD(S) vote share, format: pct, agg: wmean, weight: "votes_{year}", ramp: blues, featured: true, note: *ka_note}
    ka_ge_bjp_jds_share:  {label: BJP+JD(S) vote share, format: pct, agg: wmean, weight: "votes_{year}", ramp: oranges, featured: true, note: *ka_note}
    ka_ge_bloc_margin_pp: *ka_margin
    ka_ge_turnout_share:  *ka_turnout
    ka_ge_votes:          *ka_votes
    ka_ge_electors:       *ka_electors
    ka_ge_lead:           {featured: true}
    br_ae_nda_share:      {label: NDA vote share, format: pct, agg: wmean, weight: "votes_{year}", ramp: oranges, featured: true, note: &br_note "Unit values are the official ECI results; hexagons are modelled"}
    br_ae_mgb_share:      {label: Mahagathbandhan vote share, format: pct, agg: wmean, weight: "votes_{year}", ramp: blues, featured: true, note: *br_note}
    br_ae_jsp_share:      {label: Jan Suraaj vote share, format: pct, agg: wmean, weight: "votes_{year}", ramp: rdpu, featured: true, note: *br_note}
    br_ae_others_share:   {label: Others vote share, format: pct, agg: wmean, weight: "votes_{year}", ramp: greys, note: *br_note}
    br_ae_nota_share:     {label: NOTA share, format: pct, agg: wmean, weight: "votes_{year}", ramp: greys, note: *br_note}
    br_ae_nda_mgb_margin_pp: {label: "Margin, NDA − MGB", unit: pp, format: pp, agg: wmean, weight: "votes_{year}", density: false, ramp: buor, diverging: true, breaks: [-20, -10, -5, -2, 2, 5, 10, 20], featured: true, note: "Percentage points of valid votes; positive = NDA ahead, negative = Mahagathbandhan ahead. Unit values are the official ECI results"}
    br_ae_turnout_share:  {label: Turnout (EVM votes / electors), format: pct, agg: wmean, weight: "electors_{year}", ramp: viridis, official_col: "turnout_evm_share_{year}", note: *br_note}
    br_ae_votes:          {label: Valid votes, unit: votes, format: int, agg: sum, ramp: ylorrd, official_col: "valid_votes_{year}", note: *br_note}
    br_ae_electors:       {label: Electors, unit: electors, format: int, agg: sum, ramp: ylorrd, note: "Hexagon electors are modelled; unit values are the official ECI electors"}
    br_ae_lead:           {featured: true}
    ka_ae_booths:         &booths {label: Booths (polling stations), unit: booths, format: int, agg: sum, dtype: u16, density: true, ramp: purples, note: "Polling stations with coordinates, counted in the hexagon their pin lies in; units count every booth of their ACs"}
    ka_ge_booths:         *booths
    br_ae_booths:         *booths

# --------------------------------------------------------------------------------------------
# Features: switch any off to remove it from the UI entirely.
# --------------------------------------------------------------------------------------------
# --------------------------------------------------------------------------------------------
# Booth pins and catchments: per election, PMTiles (one zoom, z10) plus per-AC detail files,
# copied into site/data/booths/ by the build. Each source folder holds <st>_<tag>_booth_layers.json.
# --------------------------------------------------------------------------------------------
booths:
  sources:
    - D:/booth_catchment/KA/outputs/maps/booths
    - D:/booth_catchment/BR/outputs/maps/booths
  minzoom: 10                # pins and catchments from this zoom; hexagons serve lower zooms

features:
  search: true
  timeline: true            # year slider + play for year series
  change_mode: true         # "change between two years" view
  density_toggle: true      # per km² for count-type variables
  national_view: true       # distribution + rankings when nothing is selected
  compare: true             # swipe compare (variable / year / basemap)
  three_d: true             # extrude hexagons by value
  pin_compare: true         # pin units and compare them in a table
  export_png: true
  export_csv: true
  export_geojson: true
  google_links: true        # open the same place in Google Maps / Google Earth
  locate_me: true           # "which constituency am I in"
  coordinates: true         # status bar: scale bar, camera height, coordinates under the pointer
  measure: true             # ruler: path length, and area + perimeter of a closed shape
  colourblind_ramps: true   # option to swap every ramp for cividis / PuOr

# --------------------------------------------------------------------------------------------
# Look and feel.
# --------------------------------------------------------------------------------------------
ui:
  font_display: Instrument Serif
  font_body: Inter
  accent: "#b7791f"
  sidebar_width: 392

publish:
  repo: https://github.com/india-hex/India_Hex.git
  branch: gh-pages
  git_name: India Hex          # commit author shown on GitHub (keeps personal names off the repo)
  git_email: india-hex@users.noreply.github.com   # neutral address: no personal name or email in commits
