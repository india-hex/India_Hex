# ============================================================================================
# India Hex · Elections (https://india-hex.github.io/Elections/) is now part of the main app: its
# footprints are Layers → Booths → "Footprint on click". This builds the redirect that replaces it:
# every old link opens the same view on https://india-hex.github.io/India_Hex/ with footprints on.
#
#   python server.py --config india_hex_elections.yaml --build-only      build site_elections/
#   python server.py --config india_hex_elections.yaml --deploy -m "…"   publish (its own repository)
# ============================================================================================
output: site_elections            # build folder
redirect:
  to: ../India_Hex/                # relative to the old site (same origin)
  add: {fp: "1"}                   # hash keys added when the link has none: footprints on
  add_with_booth: {bp: "on", bc: "line"}   # and, for a link with a selected booth, its layers
  title: India Hex · Elections has moved
variables: {budget_mb: 950}

publish:
  repo: https://github.com/india-hex/Elections.git
  gitdir: .publish_elections.git
  git_name: India Hex
  git_email: india-hex@users.noreply.github.com
